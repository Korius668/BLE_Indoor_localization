[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name= "BLE_Indoor_localization"
dynamic = ["version"]
readme= "README.md"
requires-python = ">=3.14"
dependencies = [
    "kiwisolver>=1.4",
    "contourpy>=1.3",
    "cycler>=0.12",
    "fonttools>=4.61",
    "ImageIO>=2.37",
    "joblib>=1.5",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "packaging>=25.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyparsing>=3.2",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "six>=1.17",
    "threadpoolctl>=3.5",
    "tzdata>=2024.1"
]

[tool.setuptools]
package-dir = {"" = "src", "scripts" = "scripts"}

[tool.setuptools.packages.find]
where = ["src", "scripts"]
